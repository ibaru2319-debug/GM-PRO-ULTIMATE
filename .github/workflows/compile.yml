name: Build-GM-PRO-ULTIMATE
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install SDK 2.0.0
        run: |
          arduino-cli core update-index --additional-urls http://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core install esp8266:esp8266@2.0.0 --additional-urls http://arduino.esp8266.com/stable/package_esp8266com_index.json

      - name: Install Libs
        run: arduino-cli lib install "ESP8266 and ESP32 OLED driver for SSD1306 displays"

      - name: Compile and Merge
        run: |
          mkdir -p build
          arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 --output-dir ./build GM-PRO-ULTIMATE.ino
          
          # LINK BARU (Ganti yang error 404 tadi)
          wget https://github.com/earlephilhower/mklittlefs/releases/download/3.1.0/mklittlefs-3.1.0-linux4.amd64.tar.gz
          tar -xf mklittlefs-3.1.0-linux4.amd64.tar.gz
          
          ./mklittlefs -c data/ -p 256 -b 8192 -s 2072576 ./build/spiffs.bin
          pip install esptool
          python -m esptool --chip esp8266 merge_bin -o ./build/FULL_FIRMWARE.bin 0x0 ./build/GM-PRO-ULTIMATE.ino.bin 0x200000 ./build/spiffs.bin

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Firmware_Selesai
          path: ./build/FULL_FIRMWARE.bin
