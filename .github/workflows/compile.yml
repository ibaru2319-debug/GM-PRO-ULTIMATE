name: Build-GM-PRO-ULTIMATE

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP8266 Core SDK 2.0.0
        run: |
          arduino-cli core update-index --additional-urls http://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core install esp8266:esp8266@2.0.0 --additional-urls http://arduino.esp8266.com/stable/package_esp8266com_index.json

      - name: Install Required Libraries
        run: |
          arduino-cli lib install "ESP8266 and ESP32 OLED driver for SSD1306 displays"

      - name: Compile and Merge Firmware
        run: |
          mkdir -p build
          # Compile file INO utama
          arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 --output-dir ./build GM-PRO-ULTIMATE.ino
          
          # AMBIL MKLITTLEFS DENGAN CARA BARU (ANTI 404)
          wget https://github.com/earlephilhower/mklittlefs/releases/download/3.1.0/mklittlefs-x86_64-linux-gnu-3.1.0-8-g96112d1.tar.gz
          tar -xf mklittlefs-x86_64-linux-gnu-3.1.0-8-g96112d1.tar.gz
          mv mklittlefs*/mklittlefs ./mklittlefs
          chmod +x ./mklittlefs
          
          # Bungkus folder data menjadi binary
          ./mklittlefs -c data/ -p 256 -b 8192 -s 1024000 ./build/spiffs.bin
          
          # Gabungkan Firmware + Data jadi satu file FULL_FIRMWARE.bin
          pip install esptool
          python -m esptool --chip esp8266 merge_bin -o ./build/FULL_FIRMWARE.bin 0x0 ./build/GM-PRO-ULTIMATE.ino.bin 0x300000 ./build/spiffs.bin

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: GM-PRO-FULL-FIRMWARE
          path: ./build/FULL_FIRMWARE.bin
